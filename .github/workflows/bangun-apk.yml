name: Kompilasi APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ekstrak ZIP proyek (opsional)
        shell: bash
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "ℹ️  Tidak ada ZIP di root repo, lanjut build."
          else
            for z in "${zips[@]}"; do
              echo "📦 Ekstrak $z"
              unzip -o "$z"
            done
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # MENGUBAH DARI DEBUG KE RELEASE
      - name: Build Release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pla-manajer-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn